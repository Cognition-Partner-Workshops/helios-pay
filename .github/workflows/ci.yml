name: CI

on:
  push:
    branches: ["**"]
    paths:
      - "services/**"
      - "web/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "services/**"
      - "web/**"
      - ".github/workflows/ci.yml"

jobs:
  core-api:
    if: github.event_name == 'pull_request' || contains(join(github.event.commits.*.added, ' '), 'services/core-api') || contains(join(github.event.commits.*.modified, ' '), 'services/core-api')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://helios:helios@localhost:5432/helios
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios
        options: >-
          --health-cmd "pg_isready -U helios -d helios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core-api/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

  partner-gateway:
    if: github.event_name == 'pull_request' || contains(join(github.event.commits.*.modified, ' '), 'services/partner-gateway')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/partner-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/partner-gateway/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  ledger-worker:
    if: github.event_name == 'pull_request' || contains(join(github.event.commits.*.modified, ' '), 'services/ledger-worker')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/ledger-worker/go.sum
      - run: go vet ./...
      - run: go test ./...

  web:
    if: github.event_name == 'pull_request' || contains(join(github.event.commits.*.modified, ' '), 'web')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
