; Helios Pay statement-service — PHP2Shell (CVE-2026-109618, CVE-2026-109619)
; exploitation preconditions, applied verbatim so the demo is honestly
; vulnerable. INTENTIONALLY VULNERABLE — demo use only.

; A finite, predictable per-request limit is what makes the CVE-2026-109618
; controllable OOM reliable. The advisory's only config mitigation is -1.
memory_limit = 64M

; A finite post_max_size with multipart parsing is the reachable RFC1867 surface
; the PHP2Shell request-state corruption is reached through.
post_max_size = 8M
upload_max_filesize = 8M
max_file_uploads = 20
file_uploads = On
max_input_nesting_level = 128
max_input_vars = 10000

; CVE-2026-109619 session-lifecycle producer/consumer. Enabled by default in
; PHP; cleanup=Off keeps the stale state across the request boundary.
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.prefix = upload_progress_

; CVE-2026-109619 confirmed PHP 8.5 producer: fatal-error backtrace state is
; never reset during shutdown.
fatal_error_backtraces = On

; Make the OOM fatal observable to the runtime-validation harness.
display_errors = On
html_errors = Off
log_errors = On
