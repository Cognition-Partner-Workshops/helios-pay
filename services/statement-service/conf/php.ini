; Helios Pay statement-service — production PHP settings.
; These are hardening only. The fix for PHP2Shell (CVE-2026-109618,
; CVE-2026-109619) is the patched runtime pinned in the Dockerfile.

memory_limit = 64M

post_max_size = 8M
upload_max_filesize = 8M
max_file_uploads = 20
file_uploads = On

; The service never uses sessions.
session.upload_progress.enabled = Off
session.upload_progress.cleanup = On

fatal_error_backtraces = Off

expose_php = Off
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
