# Serve the front controller from public/. mod_php (the highest-risk SAPI per
# php.net: request shutdown runs unconditionally, even when startup OOMs).
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    DirectoryIndex index.php
</VirtualHost>
